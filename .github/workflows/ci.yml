# The gate every pull request and every push to develop goes through: the
# lockfile installs as committed, the linters pass, the production build
# succeeds, the Capacitor shell's committed files match its dependencies,
# mocha passes, and the built app boots in a real Chromium.
#
# What it cannot see: anything rendered beyond "the app boots" (the suite has
# no DOM; the browser scenarios in tools/scenarios/ stay author-side), live
# IRC (the test/irc/*.live.ts files and the Playwright e2e need an ircd), the
# native builds themselves. Pages (pages.yml) builds and publishes separately.
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      # The exact version package.json's packageManager names (pnpm does not
      # switch itself: pmOnFail is off, see pnpm-workspace.yaml). Not through
      # corepack: Node 25+ ships none.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Before mocha: test/tests/build.ts inspects public/.
      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production

      # cap sync writes the plugin list and the exact @capacitor/ios version
      # into committed files (Package.swift, capacitor.settings.gradle,
      # capacitor.build.gradle). A dependency bump that skips it, such as
      # every Dependabot PR, leaves the native shells on the old versions,
      # so fail when a sync would change anything tracked. Needs public/.
      - name: Capacitor shell in sync
        working-directory: shells/capacitor
        run: |
          pnpm install --frozen-lockfile
          pnpm sync
          if ! git diff --exit-code; then
            echo "::error::cap sync changed committed files: run 'pnpm sync' in shells/capacitor and commit the result"
            exit 1
          fi

      - name: Mocha
        run: pnpm test:mocha

      # tools/scenarios/smoke.mjs: the connect form appears, and nothing
      # throws or logs an error. Ubuntu 24.04's AppArmor forbids the
      # unprivileged user namespaces Chromium's sandbox needs, and
      # browser-drive keeps the sandbox on, so lift that for this runner.
      - name: Smoke
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm exec playwright install --with-deps chromium
          export CHROME_BIN="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          python3 -m http.server -d public 8000 &
          node tools/browser-drive.mjs tools/scenarios/smoke.mjs --no-ws
