# The gate every pull request and every push to develop goes through: the
# lockfile installs as committed, the linters and the type check pass, the
# production build succeeds, mocha passes, and the built app boots in a real
# Chromium.
#
# What it cannot see: anything rendered beyond "the app boots" (the suite has
# no DOM; the browser scenarios in tools/scenarios/ stay author-side), live
# IRC (the test/irc/*.live.ts files and the Playwright e2e need an ircd), the
# native builds themselves. Pages (pages.yml) builds and publishes separately.
name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and the type check need no build, so they run beside the build and
  # the tests rather than ahead of them.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      # The exact version package.json's packageManager names (pnpm does not
      # switch itself: pmOnFail is off, see pnpm-workspace.yaml). Not through
      # corepack: Node 25+ ships none.
      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      # The same targets anyone runs locally (Makefile); each installs the
      # lockfile as committed first.
      - name: Lint
        run: make web-lint

      # The build configs, client/ (with shared/) and tools/; not test/ yet.
      # .vue files are not type-checked.
      - name: Type check
        run: make web-typecheck

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      # Before mocha: test/tests/build.ts inspects public/. The one build:
      # mocha and the smoke test both run against this production tree
      # (`pnpm test:mocha` would build public/ again, in development mode).
      - name: Production build
        run: make web-build

      - name: Mocha
        run: make web-mocha

      # tools/scenarios/smoke.mjs through tools/smoke.sh (`make web-smoke`):
      # the connect form appears, and nothing throws or logs an error.
      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces
      # Chromium's sandbox needs, and browser-drive keeps the sandbox on, so
      # lift that for this runner. The runner image ships Google Chrome,
      # which smoke.sh finds on PATH; Playwright's Chromium (and its system
      # packages) is fetched only on an image without it.
      - name: Smoke
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if ! command -v google-chrome >/dev/null; then
            pnpm exec playwright install --with-deps --no-shell chromium
          fi
          make web-smoke
