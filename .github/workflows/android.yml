# The Android shell's build and unit tests, on pull requests and pushes to
# develop that touch what goes into the APK, and by hand. The develop run saves
# the build cache pull requests start from (they cannot read each other's).
# Not a test of the app running: nothing here boots a WebView or installs the
# APK. Pushing a tag vX.Y.Z, or a run by hand with "release" ticked, builds
# the signed release APK and AAB instead of the debug APK, with the key from
# the repository's secrets (shells/tauri/README.md § Phones). A tag's build
# is version X.Y.Z and lands in a draft GitHub release of that tag.
name: Android

on:
  pull_request:
    paths: &shell-paths
      - "Makefile"
      - ".github/workflows/android.yml"
      - "shells/tauri/**"
      # The Apple and desktop-only parts of the shell.
      - "!shells/tauri/src-tauri/gen/apple/**"
      - "!shells/tauri/src-tauri/ios/**"
      - "!shells/tauri/src-tauri/swift/**"
      - "!shells/tauri/src-tauri/Info.*.plist"
      - "!shells/tauri/src-tauri/tauri.ios.conf.json"
      - "!shells/tauri/src-tauri/windows/**"
      - "!shells/tauri/tools/linux/**"
      - "!shells/tauri/tools/*macos*"
      - "!shells/tauri/tools/shots-linux.sh"
      - "!shells/tauri/**/*.md"
  push:
    branches: [develop]
    # GitHub does not apply paths to a tag push.
    tags: ["v*"]
    paths: *shell-paths
  workflow_dispatch:
    inputs:
      release:
        description: "Build the signed release APK and AAB"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: shells/tauri/src-tauri/gen/android/**/*.gradle*

      # The image has the SDK; add compileSdk's platform and the README's NDK.
      - name: Android SDK and NDK
        run: |
          NDK=29.0.14206865
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "ndk;$NDK" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >>"$GITHUB_ENV"

      - name: Rust target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shells/tauri/src-tauri

      - name: Build
        if: env.RELEASE != 'true'
        run: make android-build

      - name: Release key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A release build needs the four ANDROID_KEY* secrets (shells/tauri/README.md § Phones)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            >shells/tauri/src-tauri/gen/android/keystore.properties

      # A tag's version replaces tauri.conf.json's; Tauri derives the
      # versionCode from it (major * 1000000 + minor * 1000 + patch), so each
      # release tag must be higher than the last for users to upgrade. A
      # release run by hand keeps tauri.conf.json's X.Y.Z, and so its
      # versionCode, and names the commit: 0.1.0-gabc1234 (the "g", as in git
      # describe, keeps an all-digit sha a valid semver prerelease).
      - name: Version
        if: env.RELEASE == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
              exit 1
            fi
          else
            SHA="${GITHUB_SHA::7}"
            VERSION="$(jq -r .version shells/tauri/src-tauri/tauri.conf.json)-g$SHA"
            echo "ARTIFACT_SUFFIX=-$SHA" >>"$GITHUB_ENV"
          fi
          echo "RELEASE_VERSION=$VERSION" >>"$GITHUB_ENV"

      - name: Release build
        if: env.RELEASE == 'true'
        run: make android-release

      - name: Unit tests
        run: make android-test

      - name: Keep the APK
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seance-android-debug
          path: shells/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Keep the release APK and AAB
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: seance-android-release${{ env.ARTIFACT_SUFFIX }}
          path: |
            shells/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            shells/tauri/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: error
          retention-days: 14

  # A draft, so a person reads it over and publishes it.
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: seance-android-release
          path: release

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          gh release create "$GITHUB_REF_NAME" release/**/*.apk release/**/*.aab \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "Seance $GITHUB_REF_NAME"
