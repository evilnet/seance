# Monthly dependency updates, minor and patch bumps grouped into one PR per
# directory; majors are left to a person (security updates still arrive for
# any version). A release must be a week old first. CI (ci.yml) is the gate.
#
# Not covered on purpose: Swift (the Capacitor CLI writes Package.swift) and
# Gradle (its versions come with each Capacitor release). shells/tauri and
# its Cargo crate get entries when the desktop shell lands on develop.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /shells/capacitor
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
