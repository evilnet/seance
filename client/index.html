<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, interactive-widget=resizes-content"
		/>

		<!-- The first paint, before style.css lands: no white flash on launch.
		     Ahead of the stylesheet link so the themes win once it arrives. -->
		<style>
			html {
				background: __THEME_COLOR__;
			}
		</style>

		<link rel="preload" as="script" href="js/loading-error-handlers.js?v=__HASH__" />
		<link rel="preload" as="script" href="js/bundle.vendor.js?v=__HASH__" />
		<link rel="preload" as="script" href="js/bundle.js?v=__HASH__" />

		<link rel="stylesheet" href="css/style.css?v=__HASH__" />
		<link id="theme" rel="stylesheet" href="themes/coffee.css" data-server-theme="coffee" />
		<style id="user-specified-css"></style>

		<title>__APP_NAME__</title>

		<!-- Browser tab icon -->
		<link
			id="favicon"
			rel="icon"
			sizes="16x16 32x32 64x64"
			href="favicon.ico"
			data-other="img/favicon-alerted.ico"
			type="image/x-icon"
		/>

		<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />

		<!-- iPhone 4, iPhone 4s, iPhone 5, iPhone 5c, iPhone 5s, iPhone 6, iPhone 6s, iPhone 7, iPhone 7s, iPhone8 -->
		<link rel="apple-touch-icon" sizes="120x120" href="img/apple-touch-icon-120.png" />
		<!-- iPad and iPad mini @2x -->
		<link rel="apple-touch-icon" sizes="152x152" href="img/apple-touch-icon-152.png" />
		<!-- iPad Pro -->
		<link rel="apple-touch-icon" sizes="167x167" href="img/apple-touch-icon-167.png" />
		<!-- iPhone X, iPhone 8 Plus, iPhone 7 Plus, iPhone 6s Plus, iPhone 6 Plus -->
		<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon-180.png" />

		<!-- Windows 8/10 - Edge tiles -->
		<meta name="application-name" content="__APP_NAME__" />
		<meta name="msapplication-TileColor" content="#0D0E14" />
		<meta name="msapplication-square70x70logo" content="img/apple-touch-icon-120.png" />
		<meta name="msapplication-square150x150logo" content="img/apple-touch-icon-152.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- iOS 26+ ignores this tag's colour, but `black-translucent` still puts
		     the app under a blurred status-bar layer that softens the header.
		     `default` leaves the bar opaque; #status-bar-tint below colours it.
		     iOS freezes the value when the icon is added, so a change here only
		     lands after the home-screen app is removed and re-added. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="__THEME_COLOR__" />
	</head>
	<body>
		<!-- What iOS samples for the status-bar colour (style.css). A real
		     element, first in the body: the sampler ignores pseudo-elements. -->
		<div id="status-bar-tint" aria-hidden="true"></div>
		<!-- A theme's own scene, behind the whole app (client/js/themeScene.ts).
		     After #status-bar-tint on purpose: iOS samples a fixed element at the
		     top for the status-bar colour, and a theme that shows this one gives
		     it the same colour (docs/projects/ps-theme.md §6). -->
		<div id="theme-scene" aria-hidden="true"></div>
		<div id="app"></div>
		<div id="loading">
			<div class="window">
				<div id="loading-status-container">
					<img src="img/logo-tile.png" alt="" width="160" height="160" />
					<p id="loading-page-message">
						__APP_NAME__ requires a modern browser with JavaScript enabled.
					</p>
				</div>
				<div id="loading-reload-container">
					<p id="loading-slow">
						This is taking longer than it should, there might be connectivity issues.
					</p>
					<button id="loading-reload" class="btn">Reload page</button>
				</div>
			</div>
		</div>
		<script src="js/loading-error-handlers.js?v=__HASH__"></script>
		<script src="js/bundle.vendor.js?v=__HASH__"></script>
		<script src="js/bundle.js?v=__HASH__"></script>
	</body>
</html>
