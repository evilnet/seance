# soju for Seance development (tools/soju-dev/run.sh). Plain listeners on
# 127.0.0.1 only; the container shares the host's network so soju reaches
# the dev nefarious2 on 127.0.0.1:6667.
hostname soju.seance.test
title "Seance dev soju"
listen ws+insecure://127.0.0.1:8090
listen irc+insecure://127.0.0.1:6668
listen unix+admin:///data/admin.sock
db sqlite3 /data/soju.db
message-store db
# The page is served from another port (python3 -m http.server 8000).
http-origin *
