# Seance dev additions, layered on top of the image's templated base.conf
# (see tools/docker/base.conf-dist on the ircv3.2-upgrade branch, which
# already opens 6667 plain, 6697 ssl, and 8443 ssl+websocket).

# Test operator: /oper seanceop seance
# The ban, force-remove and SET privileges are spelled out because the
# image's Opers class does not grant them, and the oper tools
# (docs/projects/oper-tools.md) need a rig that can G-line, shun and Z-line.
Operator {
     name = "seanceop";
     host = "*@*";
     password = "$PLAIN$seance";
     class = "Opers";
     local = no;
     gline = yes;
     local_gline = yes;
     wide_gline = yes;
     shun = yes;
     local_shun = yes;
     zline = yes;
     local_zline = yes;
     remove = yes;
     set = yes;
};

# Plain-text WebSocket so the browser can use ws://localhost:8067/ without
# any certificate trust dance.
Port {
     port = 8067;
     websocket = yes;
};

# Shared IRC/WebSocket TLS port for testing `websocket = autodetect` —
# browsers (ALPN in the ClientHello) must not get a client-certificate
# request, IRC clients on the same port must (certfp).
Port {
     port = 8444;
     ssl = yes;
     websocket = autodetect;
};

Features {
     "NETWORK" = "SeanceDev";
     "HIDDEN_HOST" = "users.seance.test";
     # Off by default on the branch; the plan wants it.
     "CAP_draft_event_playback" = "TRUE";
     "CAP_draft_message_redaction" = "TRUE";
     "CAP_draft_read_marker" = "TRUE";
     # Let unauthenticated dev clients pull history (no services here).
     "CHATHISTORY_REQUIRE_AUTH" = "FALSE";
     # Local test suites reconnect a lot; the stock clone limit (~4/min per
     # IP) makes them flaky.
     "IPCHECK_CLONE_LIMIT" = "100";
     "IPCHECK_CLONE_PERIOD" = "1";
     "IPCHECK_CLONE_DELAY" = "1";
     # Connect/exit and nick-change server notices, which the oper tools
     # classify and route (off by default on the branch).
     "CONNEXIT_NOTICES" = "TRUE";
     # Allow-all Origin while developing; tighten later, e.g.
     # "WEBSOCKET_ORIGIN" = "http://localhost:8765";
};
