# pnpm settings for the Capacitor shell, a project of its own (its own
# lockfile); this file also keeps pnpm from treating the repository root as
# its workspace.

# A flat node_modules of real directories: `cap sync` writes each plugin's
# resolved path into the committed Package.swift and capacitor.settings.gradle,
# and pnpm's default symlinks would put version-stamped .pnpm/... paths there.
nodeLinker: hoisted

# sharp (under @capacitor/assets, the icon/splash generator) downloads or
# builds its native image library at install.
allowBuilds:
    sharp: true
